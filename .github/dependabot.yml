version: 2
updates:
  # Versões novas só são propostas depois de 7 dias, quando um pacote comprometido costuma já ter sido retirado.
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # Os tipos acompanham a versão principal do Node usada no CI; tipos mais novos aceitariam APIs que não existem nela.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "pip"
    directories: ["/data", "/ml"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
